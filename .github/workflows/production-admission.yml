name: Production Admission

"on":
  pull_request:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  validate-production-lock:
    name: Validate production lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dagger/dagger-for-github@v8.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: "v0.21.4"
          verb: call
          args: >-
            production-admission
            --source=.
            --provider=auto
            --github-token=env://GITHUB_TOKEN
            export --path=build/evidence

      - name: Upload evidence reports
        uses: actions/upload-artifact@v4
        with:
          name: production-admission-evidence
          path: build/evidence/
          if-no-files-found: error
          retention-days: 30

  publication-gate:
    name: Publication gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dagger/dagger-for-github@v8.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: "v0.21.4"
          verb: call
          args: >-
            publication-gate
            --source=.
            --from-lock=true
            --purpose=production-admission
            --provider=auto
            --github-token=env://GITHUB_TOKEN
            export --path=build/evidence

      - name: Upload evidence reports
        uses: actions/upload-artifact@v4
        with:
          name: production-publication-gate-evidence
          path: build/evidence/
          if-no-files-found: error
          retention-days: 30
