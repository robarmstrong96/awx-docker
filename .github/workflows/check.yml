name: Check

"on":
  push:
    branches:
      - development
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "latest"
          verb: call
          args: check --source=.
