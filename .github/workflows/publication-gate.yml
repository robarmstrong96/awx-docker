name: Publication gate

"on":
  workflow_dispatch:
    inputs:
      awx_ref:
        description: AWX branch, tag, or commit to evaluate
        required: true
        default: devel

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  publication-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "latest"
          verb: call
          args: publication-gate --source=. --upstream-ref=${{ inputs.awx_ref }}
