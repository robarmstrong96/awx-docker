name: Publication Gate

"on":
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: AWX branch, tag, or commit to evaluate
        required: true
        default: devel

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  verify-publication-readiness:
    name: Verify publication readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dagger/dagger-for-github@v8.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: "v0.21.4"
          verb: call
          args: >-
            publication-gate
            --source=.
            --upstream-ref=${{ inputs.upstream_ref }}
            --provider=auto
            --github-token=env://GITHUB_TOKEN
            export --path=build/evidence

      - name: Upload evidence reports
        uses: actions/upload-artifact@v4
        with:
          name: publication-gate-evidence
          path: build/evidence/
          if-no-files-found: error
          retention-days: 30
