name: Build

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.21.4"
          verb: call
          args: >-
            verify
            --source=.
