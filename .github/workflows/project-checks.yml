name: Project Checks

"on":
  push:
    branches:
      - development
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.21.4"
          verb: call
          args: code-quality --source=.

  policy-tests:
    name: Policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.21.4"
          verb: call
          args: policy-tests --source=.

  public-readiness:
    name: Public readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.21.4"
          verb: call
          args: public-readiness --source=. export --path=build/evidence

      - name: Upload evidence reports
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: public-readiness-evidence
          path: build/evidence/
          if-no-files-found: error
          retention-days: 30
