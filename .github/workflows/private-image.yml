name: Private image

on:
  workflow_dispatch:
    inputs:
      awx_ref:
        description: AWX branch, tag, or commit to build
        required: true
        default: devel
      image_tag:
        description: Image tag to publish
        required: true
        default: devel
      push:
        description: Push to GHCR. Keep false until private package settings are confirmed.
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AWX_REF: ${{ inputs.awx_ref }}
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/awx-devel
      IMAGE_TAG: ${{ inputs.image_tag }}
      PUSH: ${{ inputs.push }}
    steps:
      - name: Check out wrapper
        uses: actions/checkout@v4

      - name: Run static preflight
        run: make preflight

      - name: Log in to GHCR
        if: ${{ inputs.push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build private image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.push == 'true' }}
          tags: ghcr.io/${{ github.repository_owner }}/awx-devel:${{ inputs.image_tag }}
          build-args: |
            AWX_REF=${{ inputs.awx_ref }}
            AWX_REPO=https://github.com/ansible/awx.git
            RECEPTOR_IMAGE=quay.io/ansible/receptor:devel
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            dev.awx-wrapper.awx.repo=https://github.com/ansible/awx.git
            dev.awx-wrapper.awx.ref=${{ inputs.awx_ref }}

