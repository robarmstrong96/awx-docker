name: Private image

on:
  workflow_dispatch:
    inputs:
      awx_ref:
        description: AWX branch, tag, or commit to build
        required: true
        default: devel
      image_tag:
        description: Image tag to publish
        required: true
        default: devel
      push:
        description: Push to GHCR. Keep false until private package settings are confirmed.
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AWX_REF: ${{ inputs.awx_ref }}
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/awx-devel
      IMAGE_TAG: ${{ inputs.image_tag }}
      PUSH: ${{ inputs.push }}
    steps:
      - name: Check out wrapper
        uses: actions/checkout@v4

      - name: Run static preflight
        run: make preflight

      - name: Resolve AWX ref
        id: awx
        run: |
          sha="$(./scripts/image.sh resolve-ref)"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ${AWX_REF} to ${sha}"

      - name: Log in to GHCR
        if: ${{ inputs.push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build private image
        env:
          AWX_REF: ${{ steps.awx.outputs.sha }}
          AWX_REQUESTED_REF: ${{ inputs.awx_ref }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/awx-devel
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: make build

      - name: Verify built image
        env:
          AWX_REF: ${{ steps.awx.outputs.sha }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/awx-devel
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: make verify-image

      - name: Push private image
        if: ${{ inputs.push == 'true' }}
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/awx-devel
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: make push
