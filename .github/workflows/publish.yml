name: Publish

"on":
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: AWX branch, tag, or commit to publish
        required: true
        default: devel
      image_tag:
        description: Image tag to publish
        required: true
        default: devel
      image_ref:
        description: Optional full image reference (for example ghcr.io/<owner>/<repo>:<tag>)
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image reference
        id: image
        run: |
          IMAGE_REF="${{ inputs.image_ref }}"
          if [ -z "$IMAGE_REF" ]; then
            IMAGE_REF="ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}"
          fi
          echo "ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and export AWX image
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.21.4"
          verb: call
          args: >-
            export
            --source=.
            --upstream-ref=${{ inputs.upstream_ref }}
            --image-ref=${{ steps.image.outputs.ref }}
            export --path=build/out/awx-devel.tar

      - name: Publish image
        run: |
          load_output="$(docker load -i build/out/awx-devel.tar)"
          echo "$load_output"
          loaded_image_id="$(printf '%s\n' "$load_output" | sed -n 's/^Loaded image ID: //p' | tail -n 1)"
          if [ -n "$loaded_image_id" ]; then
            docker tag "$loaded_image_id" "${{ steps.image.outputs.ref }}"
          fi
          docker push "${{ steps.image.outputs.ref }}"
