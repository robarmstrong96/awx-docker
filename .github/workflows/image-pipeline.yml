name: Image Pipeline

"on":
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      awx_ref:
        description: AWX branch, tag, or commit to build
        required: true
        default: devel
      image_tag:
        description: Image tag
        required: true
        default: devel
      image_name:
        description: Image name passed to Dagger
        required: true
        default: awx-devel

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  build-and-verify-candidate:
    name: Build and verify candidate
    runs-on: ubuntu-latest
    env:
      AWX_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.awx_ref || 'devel' }}
      IMAGE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.image_name || format('ghcr.io/{0}/awx-devel', github.repository_owner) }}
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'devel' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.21.4"
          verb: call
          args: >-
            image-pipeline
            --source=.
            --upstream-ref=${{ env.AWX_REF }}
            --provider=auto
            --image-name=${{ env.IMAGE_NAME }}
            --image-tag=${{ env.IMAGE_TAG }}
            --github-token=env://GITHUB_TOKEN
            export --path=build/evidence

      - name: Upload evidence reports
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: image-pipeline-evidence
          path: build/evidence/
          if-no-files-found: error
          retention-days: 30
