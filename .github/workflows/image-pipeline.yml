name: Image Pipeline

"on":
  push:
    branches:
      - development
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: AWX branch, tag, or commit to build
        required: true
        default: devel
      image_tag:
        description: Image tag
        required: true
        default: development
      image_name:
        description: Image name passed to Dagger
        required: true
        default: awx-devel

permissions:
  contents: read
  checks: read
  statuses: read
  packages: write

jobs:
  build-and-verify-candidate:
    name: Publish development image
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream_ref || 'devel' }}
      IMAGE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.image_name || format('ghcr.io/{0}/awx-devel', github.repository_owner) }}
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dagger/dagger-for-github@v8.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: "v0.21.4"
          verb: call
          args: >-
            image-publish
            --source=.
            --upstream-ref=${{ env.UPSTREAM_REF }}
            --provider=auto
            --image-ref=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            --registry-username=${{ github.actor }}
            --registry-token=env://GITHUB_TOKEN
            --github-token=env://GITHUB_TOKEN
            export --path=build/evidence

      - name: Upload evidence reports
        uses: actions/upload-artifact@v4
        with:
          name: image-pipeline-evidence
          path: build/evidence/
          if-no-files-found: error
          retention-days: 30
