name: Image build

"on":
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      awx_ref:
        description: AWX branch, tag, or commit to build
        required: true
        default: devel
      image_tag:
        description: Image tag
        required: true
        default: devel
      image_name:
        description: Image name passed to Dagger
        required: true
        default: awx-devel
      publish_image:
        description: Run publication gate checks
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: write
  checks: read
  statuses: read

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      AWX_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.awx_ref || 'devel' }}
      IMAGE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.image_name || format('ghcr.io/{0}/awx-devel', github.repository_owner) }}
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'devel' }}
      PUBLISH_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_image || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "latest"
          verb: call
          args: upstream-health --source=. --upstream-ref=${{ env.AWX_REF }} --mode=scheduled-build

      - uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "latest"
          verb: call
          args: image-build --source=. --awx-ref=${{ env.AWX_REF }} --image-name=${{ env.IMAGE_NAME }} --image-tag=${{ env.IMAGE_TAG }}

      - uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "latest"
          verb: call
          args: image-verify --source=. --awx-ref=${{ env.AWX_REF }} --image-name=${{ env.IMAGE_NAME }} --image-tag=${{ env.IMAGE_TAG }}

      - uses: dagger/dagger-for-github@v8.3.0
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        with:
          version: "latest"
          verb: call
          args: release-check --source=. --upstream-ref=${{ env.AWX_REF }}

      - name: Confirm manual publication
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        run: |
          echo "Automated image publication is disabled. Review publication gate evidence before publishing manually."
