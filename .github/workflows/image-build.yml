name: Image build

"on":
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      awx_ref:
        description: AWX branch, tag, or commit to build
        required: true
        default: devel
      image_tag:
        description: Image tag to publish
        required: true
        default: devel
      publish_image:
        description: Push to GHCR.
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: write
  statuses: read
  checks: read

concurrency:
  group: awx-image-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AWX_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.awx_ref || 'devel' }}
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/awx-devel
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'devel' }}
      PUBLISH_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_image || 'true' }}
      EVIDENCE_DIR: build/evidence
    steps:
      - name: Check out wrapper
        uses: actions/checkout@v4

      - name: Run static preflight
        run: make preflight

      - name: Check public hygiene
        run: make public-hygiene

      - name: Resolve AWX ref
        id: awx
        run: |
          sha="$(./scripts/image.sh resolve-ref)"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ${AWX_REF} to ${sha}"

      - name: Check upstream AWX status
        env:
          AWX_REF: ${{ steps.awx.outputs.sha }}
          AWX_REQUESTED_REF: ${{ env.AWX_REF }}
          GITHUB_TOKEN: ${{ github.token }}
        run: make check-upstream-status

      - name: Write build metadata
        env:
          AWX_REF: ${{ steps.awx.outputs.sha }}
          AWX_REQUESTED_REF: ${{ env.AWX_REF }}
          AWX_RESOLVED_REF: ${{ steps.awx.outputs.sha }}
        run: make write-metadata

      - name: Log in to GHCR
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Reclaim runner disk
        run: |
          set -euo pipefail
          df -h /
          for path in \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/share/dotnet; do
            if [ -e "$path" ]; then
              echo "Removing $path"
              sudo timeout 45s rm -rf "$path" || true
            fi
          done
          docker system prune -af || true
          df -h /

      - name: Write runner diagnostics
        run: make write-runner-diagnostics

      - name: Build image
        timeout-minutes: 240
        env:
          AWX_REF: ${{ steps.awx.outputs.sha }}
          AWX_REQUESTED_REF: ${{ env.AWX_REF }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/awx-devel
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          mkdir -p build/evidence
          make build 2>&1 | tee build/evidence/docker-build.log

      - name: Verify built image
        env:
          AWX_REF: ${{ steps.awx.outputs.sha }}
          AWX_REQUESTED_REF: ${{ env.AWX_REF }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/awx-devel
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          mkdir -p build/evidence
          make verify-image 2>&1 | tee build/evidence/image-verification.log

      - name: Push image
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        env:
          AWX_REF: ${{ steps.awx.outputs.sha }}
          AWX_REQUESTED_REF: ${{ env.AWX_REF }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/awx-devel
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: make push

      - name: Publish evidence summary
        if: ${{ always() }}
        run: |
          {
            echo "## AWX image build evidence"
            for file in \
              build/evidence/build-metadata.md \
              build/evidence/upstream-status.md \
              build/evidence/runner-diagnostics.md \
              build/evidence/image-verification.md; do
              if [ -f "$file" ]; then
                echo
                cat "$file"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: awx-image-build-evidence
          path: build/evidence/
          if-no-files-found: ignore
          retention-days: 1
