name: Production Pipeline

"on":
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  build-locked-image:
    name: Build locked image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.21.4"
          verb: call
          args: >-
            production-pipeline
            --source=.
            --provider=auto
            --github-token=env://GITHUB_TOKEN
            export --path=build/evidence

      - name: Upload evidence reports
        uses: actions/upload-artifact@v4
        with:
          name: production-pipeline-evidence
          path: build/evidence/
          if-no-files-found: error
          retention-days: 30
