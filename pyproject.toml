[project]
name = "awx-docker"
version = "0.1.0"
description = "Unofficial AWX proof-of-concept image builder"
requires-python = ">=3.12"
dependencies = [
  "dagger-io>=0.18.0",
  "jsonschema>=4.23.0",
  "pyyaml>=6.0.2",
  "requests>=2.32.3",
]

[project.scripts]
awx-docker = "awx_docker.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "ruff>=0.8.6",
  "yamllint>=1.35.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awx_docker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
