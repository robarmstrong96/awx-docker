schema: awx-docker.upstream-health/v2

github:
  combined_status:
    enabled: true
    missing: warn

  check_runs:
    enabled: true
    missing: warn
    per_page: 100

decisions:
  fail_on_check_conclusions:
    - failure
    - cancelled
    - timed_out
    - action_required
    - startup_failure

  wait_on_check_statuses:
    - queued
    - in_progress
    - pending
    - requested
    - waiting

  blocking_failed_check_name_patterns:
    - "\\bbuild\\b"
    - "\\bcontainer build\\b"
    - "\\bimage build\\b"
    - "\\bdocker build\\b"
    - "\\bbuildx\\b"
    - "\\bpush-development-images\\b"

  non_blocking_failed_check_name_patterns:
    - "\\bSonarCloud Code Analysis\\b"
    - "\\bsonarcloud\\b"
    - "\\bsonar\\b"
    - "\\blint\\b"
    - "\\bstatic[- ]?analysis\\b"
    - "\\bdocs?\\b"
    - "\\bdocumentation\\b"

  required_success_check_name_patterns:
    - "\\bbuild\\b"
    - "\\bcontainer build\\b"
    - "\\bimage build\\b"
    - "\\bdocker build\\b"
    - "\\bbuildx\\b"
    - "\\bpush-development-images\\b"

modes:
  scheduled-build:
    unknown_signal: warn
    warning_signal: warn
    missing_build_signal: warn
    wait_signal: fail
    fail_signal: fail

  local:
    unknown_signal: warn
    warning_signal: warn
    missing_build_signal: warn
    wait_signal: warn
    fail_signal: fail

  publication:
    unknown_signal: fail
    warning_signal: fail
    missing_build_signal: fail
    wait_signal: fail
    fail_signal: fail
