schema: awx-docker.image-publication/v1

visibility:
  manual_only: true

required_checks:
  - public-readiness
  - upstream-health
  - image-verification

contexts:
  repository:
    required_checks:
      - public-readiness
      - upstream-health

  production-admission:
    required_checks:
      - public-readiness
      - upstream-health

  image-publication:
    required_checks:
      - public-readiness
      - upstream-health
      - image-verification

  production-promotion:
    required_checks:
      - public-readiness
      - upstream-health
      - image-verification

branding:
  official_claims_allowed: false
  logos_allowed: false
